# create venv first
# prod: run "pip install -e ."
# dev: run "pip install -e ".[dev]""

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "t2c_mcp"    # package name
version = "0.1.0"
requires-python = ">=3.13.7,<3.14"
dependencies = [    # prod deps
    "cadquery==2.7.0",
    "mcp==1.27.0",
    "ocp-vscode==3.3.4",
    "posthog>=7.33,<8",    # MCP analytics (posthog.mcp); beta SDK, pin the major
    # Parametric part plugins (gears + mechanical parts), pinned to a commit.
    # Both only need the already-pinned cadquery/numpy, so they don't move the pin.
    "cq_gears @ git+https://github.com/meadiode/cq_gears.git@e73874cf17a25447a99b1e7c22a4d5af38560e9c",
    "cq_warehouse @ git+https://github.com/gumyr/cq_warehouse.git@daa46507ecc429c0e2dce11d9d5ffd09b12a42af",
    # Adds a Workplane.heatsert() hole builder (M3–M6 presets). No deps of its own.
    "heatserts @ git+https://github.com/CadQuery/cadquery-plugins.git@364500a1adeb7b99bf06135245850f5ba70b9ae6#subdirectory=plugins/heatserts"
]

[project.optional-dependencies]
dev = [     # dev deps
    "pytest>=9.0", 
    "ruff>=0.15"
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = []
ignore = []

[tool.ruff.format]
indent-style = "space"    # default = 4 spaces per indent
