<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Reset your password</title>
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
  <![endif]-->
  <style>
    a { text-decoration: none; }
    @media (max-width: 520px) {
      .card { width: 100% !important; border-radius: 0 !important; }
      .px { padding-left: 24px !important; padding-right: 24px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; width:100%; background-color:#f5f5f5; -webkit-font-smoothing:antialiased;">
  <!-- Preheader (hidden inbox preview text) -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#f5f5f5;">
    Choose a new password for your Text2CAD AI account.
    &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f5f5f5"
    style="background-color:#f5f5f5; background-image:linear-gradient(to right, rgba(23,23,23,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(23,23,23,0.05) 1px, transparent 1px); background-size:34px 34px;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <!-- Card -->
        <table role="presentation" class="card" width="460" cellpadding="0" cellspacing="0" border="0"
          style="width:460px; max-width:460px; background-color:#ffffff; border:1px solid #e5e5e5; border-radius:14px; overflow:hidden;">

          <!-- Wordmark with flanking rules (centered, responsive) -->
          <tr>
            <td class="px" style="padding:24px 32px 0 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="width:50%; vertical-align:middle;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
                      <td height="1" bgcolor="#d4d4d4" style="height:1px; line-height:1px; font-size:0;">&nbsp;</td>
                    </tr></table>
                  </td>
                  <td style="padding:0 14px; white-space:nowrap; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:16px; font-weight:600; letter-spacing:-0.01em; color:#171717;">
                    Text2CAD&nbsp;AI
                  </td>
                  <td style="width:50%; vertical-align:middle;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
                      <td height="1" bgcolor="#d4d4d4" style="height:1px; line-height:1px; font-size:0;">&nbsp;</td>
                    </tr></table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Hero render -->
          <tr>
            <td class="px" style="padding:14px 32px 0 32px;">
              <a href="https://cadopy.com" target="_blank" style="text-decoration:none;">
                <img src="https://cadopy.com/examples/m12bolt.jpeg"
                  width="396" alt="An M12 bolt and nut modelled from a text prompt with Text2CAD AI"
                  style="display:block; width:100%; max-width:396px; height:auto; border:1px solid #e5e5e5; border-radius:10px;">
              </a>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td class="px" style="padding:20px 32px 0 32px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <h1 style="margin:0 0 6px 0; font-size:19px; line-height:1.3; font-weight:600; letter-spacing:-0.02em; color:#171717;">
                Reset your password
              </h1>
              <p style="margin:0; font-size:14px; line-height:1.5; color:#404040;">
                Click below to choose a new password.
              </p>
            </td>
          </tr>

          <!-- CTA (bulletproof) -->
          <tr>
            <td class="px" style="padding:18px 32px 0 32px;">
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{ .ConfirmationURL }}" style="height:44px;v-text-anchor:middle;width:158px;" arcsize="22%" strokecolor="#171717" fillcolor="#171717">
                <w:anchorlock/><center style="color:#ffffff;font-family:sans-serif;font-size:14px;font-weight:600;">Reset password</center>
              </v:roundrect>
              <![endif]-->
              <!--[if !mso]><!-- -->
              <a href="{{ .ConfirmationURL }}" target="_blank"
                style="display:inline-block; background-color:#171717; color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; font-weight:600; line-height:44px; text-align:center; text-decoration:none; padding:0 26px; border-radius:10px;">
                Reset password
              </a>
              <!--<![endif]-->
            </td>
          </tr>

          <!-- Fallback + reassurance -->
          <tr>
            <td class="px" style="padding:16px 32px 24px 32px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <p style="margin:0; font-size:12px; line-height:1.5; color:#a3a3a3;">
                Didn't request this? Ignore this email.
              </p>
            </td>
          </tr>
        </table>

        <!-- Footer -->
        <table role="presentation" width="460" cellpadding="0" cellspacing="0" border="0" style="width:460px; max-width:460px;">
          <tr>
            <td align="center" style="padding:16px 24px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:1.5; color:#a3a3a3;">
              <a href="https://cadopy.com" target="_blank" style="color:#737373; font-weight:600; text-decoration:none;">Text2CAD&nbsp;AI</a> — Turn text into 3D CAD
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
